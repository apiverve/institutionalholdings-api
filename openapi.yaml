openapi: 3.0.4
info:
  title: Institutional Holdings
  description: >-
    Institutional Holdings returns SEC Form 13F holdings: every position a fund
    manager reported for a quarter, with shares, value, portfolio weight,
    put/call, discretion and voting authority, plus the quarter-over-quarter
    change on every position. Look up a manager by CIK or name, or reverse it
    and list every institution holding a ticker or CUSIP.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/institutionalholdings:
    get:
      summary: Institutional Holdings
      description: >-
        Get a fund manager's 13F holdings with quarter-over-quarter changes (cik
        or manager), or every manager holding a security (ticker or cusip).
      operationId: institutionalholdings
      parameters:
        - name: cik
          in: query
          schema:
            type: string
          required: false
          description: >-
            SEC Central Index Key of the 13F filer, e.g. 1067983 for Berkshire
            Hathaway. Returns that manager's holdings.
          example: '1067983'
        - name: manager
          in: query
          schema:
            type: string
          required: false
          description: >-
            Manager name to search for instead of cik, e.g. bridgewater. The
            best match is returned, with other close matches in otherMatches.
          example: berkshire hathaway
        - name: ticker
          in: query
          schema:
            type: string
          required: false
          description: >-
            Ticker symbol. Alone, lists the managers holding it; with cik or
            manager, filters that manager's holdings to it.
          example: AAPL
        - name: cusip
          in: query
          schema:
            type: string
          required: false
          description: >-
            9-character CUSIP. Alone, lists the managers holding it; with cik or
            manager, filters that manager's holdings to it.
          example: '037833100'
        - name: period
          in: query
          schema:
            type: string
          required: false
          description: >-
            Quarter to read, as a quarter end (2026-03-31) or quarter (2026Q1).
            Defaults to the latest quarter.
          example: 2026Q1
        - name: changeType
          in: query
          schema:
            type: string
          required: false
          description: >-
            Only positions that are new, increased, decreased, unchanged or
            soldout since the previous quarter. Sold-out positions appear only
            with soldout.
          example: new
        - name: putCall
          in: query
          schema:
            type: string
          required: false
          description: >-
            Option filter: put, call, none (shares and principal only) or all.
            Defaults to all.
          example: none
        - name: minValue
          in: query
          schema:
            type: number
          required: false
          description: Only positions worth at least this many US dollars.
          example: 1000000
        - name: maxValue
          in: query
          schema:
            type: number
          required: false
          description: Only positions worth at most this many US dollars.
          example: 1000000000
        - name: sort
          in: query
          schema:
            type: string
          required: false
          description: >-
            Sort by value (default), shares, change (share change),
            changepercent or portfolio (weight).
          example: value
        - name: order
          in: query
          schema:
            type: string
          required: false
          description: 'Sort order: desc (default) or asc.'
          example: desc
        - name: limit
          in: query
          schema:
            type: integer
          required: false
          description: Rows to return (1-100). Defaults to 10.
          example: 25
        - name: offset
          in: query
          schema:
            type: integer
          required: false
          description: Rows to skip, for paging through a large portfolio or holder list.
          example: 25
        - name: summary
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Add a summary: for a manager, value change, position counts by
            change type, top-10 concentration and turnover; for a security,
            holder flows and top-10 share concentration.
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
